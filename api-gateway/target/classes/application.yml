server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # API routes
        - id: auth-profile
          uri: lb://auth-profile-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/admin/users/**
          filters:
            - StripPrefix=1

        - id: vehicle
          uri: lb://vehicle-service
          predicates:
            - Path=/api/vehicles/**
          filters:
            - StripPrefix=1

        - id: trip
          uri: lb://trip-service
          predicates:
            - Path=/api/trips/**,/api/bookings/**
          filters:
            - StripPrefix=1

        - id: location
          uri: lb://location-service
          predicates:
            - Path=/api/location/**
          filters:
            - StripPrefix=1

        - id: payment
          uri: lb://payment-cost-service
          predicates:
            - Path=/api/costs/**,/api/payments/**
          filters:
            - StripPrefix=1

        - id: admin
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        # Front-end (Thymeleaf) through gateway (optional; can bypass for static assets)
        - id: frontweb
          uri: lb://front-end-web
          predicates:
            - Path=/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_64_CHARS_MINIMUM________________}
