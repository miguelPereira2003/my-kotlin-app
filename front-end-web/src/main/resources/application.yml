server:
  port: 8081

spring:
  application:
    name: front-end-web
  thymeleaf:
    cache: false

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  apiBase: ${API_BASE_URL:http://api-gateway:8080/api}
