<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Car Pooling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-4">
  <h1 class="mb-3">Plataforma de Car Pooling</h1>

  <div th:if="${loggedIn}">
    <form method="post" action="/logout" class="mb-3">
      <button class="btn btn-outline-secondary">Logout</button>
    </form>
    <a class="btn btn-primary" href="/trips/search">Procurar Viagens</a>
  </div>

  <div th:if="${!loggedIn}">
    <a class="btn btn-primary me-2" href="/login">Login</a>
    <a class="btn btn-outline-primary" href="/register">Registo</a>
  </div>
</body>
</html>
