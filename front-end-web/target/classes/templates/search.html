<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pesquisar Viagens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-4">
  <h2>Pesquisar Viagens</h2>
  <form method="post" action="/trips/search" class="row g-2 mb-4">
    <div class="col-md-5">
      <input class="form-control" name="origin" placeholder="Origem" required/>
    </div>
    <div class="col-md-5">
      <input class="form-control" name="destination" placeholder="Destino" required/>
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100">Pesquisar</button>
    </div>
  </form>

  <div th:if="${trips}">
    <h5>Resultados</h5>
    <table class="table table-sm">
      <thead>
        <tr>
          <th>Origem</th>
          <th>Destino</th>
          <th>Data/Hora</th>
          <th>Lugares</th>
          <th>Distância (km)</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="t : ${trips}">
          <td th:text="${t.originText}"></td>
          <td th:text="${t.destinationText}"></td>
          <td th:text="${t.departureTime}"></td>
          <td th:text="${t.availableSeats}"></td>
          <td th:text="${t.estimatedDistanceKm}"></td>
          <td th:text="${t.status}"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <a class="btn btn-link" href="/">Home</a>
</body>
</html>
